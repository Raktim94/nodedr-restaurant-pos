name: Windows MSIX build

# Real build/package/install verification for the OrderRestro Windows
# client, run on an actual windows-latest runner since no Windows machine
# is available in local development. This is the authoritative PASS/FAIL
# signal for "does the MSIX build and install" — see windows/msix/README.md
# for what this does and does not prove (no physical hardware, no printer,
# no Start Menu/UAC-prompt visual check — those need a human on real
# hardware).

on:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-msix.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch: {}

jobs:
  build-and-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # windows-latest ships the Windows 10/11 SDK (part of the VS Build
      # Tools workload) but makeappx.exe/signtool.exe aren't on PATH by
      # default outside a "Developer PowerShell for VS" prompt — locate the
      # highest-versioned x64 SDK bin directory and add it for the rest of
      # this job.
      - name: Add Windows SDK tools (makeappx, signtool) to PATH
        shell: pwsh
        run: |
          # Not every "…\bin\<version>\x64" directory actually contains
          # makeappx.exe (some SDK component subsets on hosted runners omit
          # it) — search for the tool itself rather than assuming the
          # highest-versioned directory has it.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) {
            Write-Host "Windows Kits 10 bin dirs found:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  $($_.FullName): $((Get-ChildItem $_.FullName -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 5 -ExpandProperty Name) -join ', ')"
            }
            throw "makeappx.exe not found under any Windows 10/11 SDK bin directory"
          }
          $sdkBinDir = Split-Path $makeappx.FullName -Parent
          Write-Host "Using SDK tools from: $sdkBinDir"
          Add-Content -Path $env:GITHUB_PATH -Value $sdkBinDir

      - name: Build + package (self-signed test cert)
        shell: pwsh
        working-directory: windows/msix
        run: |
          ./build-windows-msix.ps1 -Configuration Release -SelfSignedTest

      - name: Validate package structure
        shell: pwsh
        working-directory: windows/msix
        run: |
          # No -AllowPlaceholderPublisher needed: AppxManifest.xml now
          # carries the real Partner Center publisher identity, and
          # build-windows-msix.ps1's -SelfSignedTest cert subject tracks
          # that same value — so the default (strict) placeholder check
          # is the real, meaningful signal here, not a false failure.
          ./validate-msix.ps1 -MsixPath ./out/OrderRestro.msix

      - name: Install + verify Start Menu registration
        shell: pwsh
        working-directory: windows/msix
        run: |
          Add-AppxPackage -Path ./out/OrderRestro.msix -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'NodedrInfotech.OrderRestro'
          if (-not $pkg) { throw "Package not found after install" }
          Write-Host "PackageFullName: $($pkg.PackageFullName)"
          Write-Host "InstallLocation: $($pkg.InstallLocation)"

      - name: Uninstall (cleanup)
        if: always()
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name 'NodedrInfotech.OrderRestro' -ErrorAction SilentlyContinue
          if ($pkg) { Remove-AppxPackage -Package $pkg.PackageFullName }

      - name: Upload MSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrderRestro-msix-${{ github.sha }}
          path: windows/msix/out/OrderRestro.msix
          if-no-files-found: warn
