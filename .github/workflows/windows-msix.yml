name: Windows MSIX build

# Real build/package/install verification for the OrderRestro Windows
# client, run on an actual windows-latest runner since no Windows machine
# is available in local development. This is the authoritative PASS/FAIL
# signal for "does the MSIX build and install" — see windows/msix/README.md
# for what this does and does not prove (no physical hardware, no printer,
# no Start Menu/UAC-prompt visual check — those need a human on real
# hardware).

on:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-msix.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch: {}

jobs:
  build-and-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # windows-latest ships the Windows 10/11 SDK (part of the VS Build
      # Tools workload) but makeappx.exe/signtool.exe aren't on PATH by
      # default outside a "Developer PowerShell for VS" prompt — locate the
      # highest-versioned x64 SDK bin directory and add it for the rest of
      # this job.
      - name: Add Windows SDK tools (makeappx, signtool) to PATH
        shell: pwsh
        run: |
          # Not every "…\bin\<version>\x64" directory actually contains
          # makeappx.exe (some SDK component subsets on hosted runners omit
          # it) — search for the tool itself rather than assuming the
          # highest-versioned directory has it.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) {
            Write-Host "Windows Kits 10 bin dirs found:"
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  $($_.FullName): $((Get-ChildItem $_.FullName -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 5 -ExpandProperty Name) -join ', ')"
            }
            throw "makeappx.exe not found under any Windows 10/11 SDK bin directory"
          }
          $sdkBinDir = Split-Path $makeappx.FullName -Parent
          Write-Host "Using SDK tools from: $sdkBinDir"
          Add-Content -Path $env:GITHUB_PATH -Value $sdkBinDir

      - name: Build + package (self-signed test cert)
        shell: pwsh
        working-directory: windows/msix
        run: |
          ./build-windows-msix.ps1 -Configuration Release -SelfSignedTest

      - name: Validate package structure
        shell: pwsh
        working-directory: windows/msix
        run: |
          # No -AllowPlaceholderPublisher needed: AppxManifest.xml now
          # carries the real Partner Center publisher identity, and
          # build-windows-msix.ps1's -SelfSignedTest cert subject tracks
          # that same value — so the default (strict) placeholder check
          # is the real, meaningful signal here, not a false failure.
          ./validate-msix.ps1 -MsixPath ./out/OrderRestro.msix

      - name: Install + verify Start Menu registration
        shell: pwsh
        working-directory: windows/msix
        run: |
          Add-AppxPackage -Path ./out/OrderRestro.msix -ErrorAction Stop
          # Read the identity Name from the manifest rather than hardcoding
          # it a second time here — a prior mismatch (manifest updated,
          # this string left stale) made Get-AppxPackage silently find
          # nothing even though install succeeded.
          [xml]$manifest = Get-Content ./AppxManifest.xml
          $pkg = Get-AppxPackage -Name $manifest.Package.Identity.Name
          if (-not $pkg) { throw "Package not found after install" }
          Write-Host "PackageFullName: $($pkg.PackageFullName)"
          Write-Host "InstallLocation: $($pkg.InstallLocation)"

      - name: Simulate existing user config (pre-upgrade)
        shell: pwsh
        run: |
          $configDir = Join-Path $env:LOCALAPPDATA 'OrderRestro'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          '{"ServerUrl":"http://192.168.1.50:1995"}' | Set-Content (Join-Path $configDir 'config.json')

      - name: Bump version for upgrade-in-place test
        shell: pwsh
        working-directory: windows/msix
        run: |
          # Scratch bump on the runner only (not committed) — proves
          # Add-AppxPackage upgrades this identity in place (same
          # Name+Publisher, higher Version) instead of requiring an
          # uninstall first, and that %LOCALAPPDATA% user config survives.
          [xml]$manifest = Get-Content ./AppxManifest.xml
          $manifest.Package.Identity.Version = '1.0.0.1'
          $manifest.Save((Resolve-Path ./AppxManifest.xml))
          (Get-Content ./Launcher/Launcher.csproj -Raw) -replace '<Version>1\.0\.0\.0</Version>', '<Version>1.0.0.1</Version>' |
            Set-Content ./Launcher/Launcher.csproj

      - name: Build + package upgrade (v1.0.0.1)
        shell: pwsh
        working-directory: windows/msix
        run: |
          ./build-windows-msix.ps1 -Configuration Release -SelfSignedTest

      - name: Install upgrade in place and verify
        shell: pwsh
        working-directory: windows/msix
        run: |
          Add-AppxPackage -Path ./out/OrderRestro.msix -ErrorAction Stop
          [xml]$manifest = Get-Content ./AppxManifest.xml
          $pkg = Get-AppxPackage -Name $manifest.Package.Identity.Name
          if (-not $pkg) { throw "Package not found after upgrade install" }
          if ($pkg.Version.ToString() -ne '1.0.0.1') {
            throw "Expected version 1.0.0.1 after upgrade, got $($pkg.Version)"
          }
          $configPath = Join-Path $env:LOCALAPPDATA 'OrderRestro\config.json'
          if (-not (Test-Path $configPath)) { throw "Pre-upgrade config.json did not survive the upgrade" }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.ServerUrl -ne 'http://192.168.1.50:1995') {
            throw "config.json content changed across upgrade: $($config.ServerUrl)"
          }
          Write-Host "Upgrade verified: now $($pkg.PackageFullName), user config survived." -ForegroundColor Green

      - name: Uninstall (cleanup)
        if: always()
        shell: pwsh
        working-directory: windows/msix
        run: |
          [xml]$manifest = Get-Content ./AppxManifest.xml
          $pkg = Get-AppxPackage -Name $manifest.Package.Identity.Name -ErrorAction SilentlyContinue
          if ($pkg) { Remove-AppxPackage -Package $pkg.PackageFullName }

      - name: Check for Windows App Certification Kit (informational)
        if: always()
        shell: pwsh
        run: |
          # Non-blocking: just records whether WACK is present on this
          # hosted runner so windows/msix/README.md's "not tested" claim
          # about WACK is based on a real check, not an assumption.
          $appcert = Get-ChildItem "C:\Program Files*\Windows Kits\10\App Certification Kit\appcert.exe" -ErrorAction SilentlyContinue
          if ($appcert) {
            Write-Host "appcert.exe FOUND at $($appcert.FullName)" -ForegroundColor Green
          } else {
            Write-Host "appcert.exe NOT found on this windows-latest runner — WACK is not preinstalled here, confirming it must be run elsewhere (a Windows dev machine with the SDK's App Certification Kit component, or via Partner Center's own submission-time certification)." -ForegroundColor Yellow
          }

      - name: Upload MSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrderRestro-msix-${{ github.sha }}
          path: windows/msix/out/OrderRestro.msix
          if-no-files-found: warn
